<header id="">
  <div>
    <img ngSrc="/images/logo.png" alt="Logo" width="40" height="40" />
    <p class="project-name">Recicla Belém</p>
  </div>
  <article class="menu">
    <a class="active" href="/#">Home</a>
    <a class="active" href="/#como-funciona">Como funciona</a>
    <a class="active" href="/mapa">Mapa</a>
  </article>
  <div class="auth">
    @if (authStore.isAuth()) {
      <button class="profile-button" type="button" [matMenuTriggerFor]="profileMenu" aria-label="Abrir menu da conta">
        @if (authStore.user()?.profileImageUrl && !imageFailed()) {
          <img [src]="authStore.user()?.profileImageUrl" alt="" class="avatar" (error)="imageFailed.set(true)" />
        }
        <span>{{ authStore.user()?.name || authStore.user()?.email }}</span>
      </button>
      <mat-menu #profileMenu="matMenu">
        <button mat-menu-item (click)="logout()">Sair</button>
      </mat-menu>
    }
    @if (!authStore.isAuth()) {
      <a routerLink="/autenticacao/login">Login</a>
    }
  </div>
</header>
